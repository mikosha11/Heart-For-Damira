<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Heart Dust (Drag & Zoom)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap">
<style>
  :root {
    --stage:        #07060a;
    --stage-lift:   #0c0812;
    --dust-pale:    #ffe1ee;
    --ink:          #e8dbe4;
    --ink-dim:      #7d6f7a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--stage);
    color: var(--ink);
    font-family: "Jost", "Avenir Next", system-ui, sans-serif;
    overflow: hidden;
    touch-action: none; /* Отключаем скролл и системный зум браузера */
    user-select: none;
  }

  .stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(120% 90% at 50% 52%, var(--stage-lift) 0%, var(--stage) 62%);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
  }
  canvas:active {
    cursor: grabbing;
  }

  .controls {
    position: fixed;
    left: 50%;
    bottom: clamp(18px, 4vh, 40px);
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 18px;
    opacity: 0;
    transition: opacity 900ms ease;
    pointer-events: none;
  }
  .controls.show { opacity: 1; pointer-events: auto; }

  button.replay {
    appearance: none;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 9px 18px 9px 15px;
    border-radius: 999px;
    border: 1px solid rgba(255, 138, 184, 0.28);
    background: rgba(255, 138, 184, 0.07);
    color: var(--dust-pale);
    font: 300 12px/1 "Jost", system-ui, sans-serif;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 260ms ease, border-color 260ms ease, color 260ms ease;
  }
  button.replay:hover {
    background: rgba(255, 138, 184, 0.16);
    border-color: rgba(255, 138, 184, 0.55);
    color: #fff;
  }

  .mark {
    position: fixed;
    top: clamp(16px, 3.4vh, 32px);
    left: 0;
    right: 0;
    text-align: center;
    font-size: clamp(10px, 1.4vw, 12px);
    font-weight: 300;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--ink-dim);
    opacity: 0;
    transition: opacity 1400ms ease;
    pointer-events: none;
  }
  .mark.show { opacity: 0.75; }
</style>
</head><body>
<div class="stage">
  <canvas id="c"></canvas>
</div>

<p class="mark" id="mark">Heart Dust • Drag & Scroll</p>

<div class="controls" id="controls">
  <button class="replay" id="replay" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
    Reset
  </button>
</div>

<script>
(() => {
  "use strict";

  const canvas   = document.getElementById("c");
  const ctx      = canvas.getContext("2d", { alpha: true });
  const controls = document.getElementById("controls");
  const mark     = document.getElementById("mark");
  const replayEl = document.getElementById("replay");

  const TINTS = [
    { hex: "#ffe9f3", w: 0.06 },
    { hex: "#ffc2dc", w: 0.16 },
    { hex: "#ff8ab8", w: 0.32 },
    { hex: "#f4478f", w: 0.28 },
    { hex: "#d32d6f", w: 0.13 },
    { hex: "#8e1447", w: 0.05 }
  ];
  const BG = [7, 6, 10];

  const SPRITE = 48;
  const sprites = TINTS.map(t => {
    const s = document.createElement("canvas");
    s.width = s.height = SPRITE;
    const g = s.getContext("2d");
    const grad = g.createRadialGradient(SPRITE/2, SPRITE/2, 0, SPRITE/2, SPRITE/2, SPRITE/2);
    const c = t.hex;
    grad.addColorStop(0.00, hexA(c, 1));
    grad.addColorStop(0.14, hexA(c, 0.82));
    grad.addColorStop(0.34, hexA(c, 0.30));
    grad.addColorStop(0.62, hexA(c, 0.07));
    grad.addColorStop(1.00, hexA(c, 0));
    g.fillStyle = grad;
    g.fillRect(0, 0, SPRITE, SPRITE);
    return s;
  });

  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  }

  function pickTint() {
    let r = Math.random(), acc = 0;
    for (let i = 0; i < TINTS.length; i++) { acc += TINTS[i].w; if (r <= acc) return i; }
    return TINTS.length - 1;
  }

  function heartPoint(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
    return [x, y];
  }

  function buildOutline(steps) {
    const pts = new Float64Array(steps * 2);
    const cum = new Float64Array(steps);
    let len = 0;
    for (let i = 0; i < steps; i++) {
      const t = (i / (steps - 1)) * Math.PI * 2;
      const [x, y] = heartPoint(t);
      pts[i*2] = x; pts[i*2+1] = y;
      if (i > 0) len += Math.hypot(x - pts[(i-1)*2], y - pts[(i-1)*2+1]);
      cum[i] = len;
    }
    return { pts, cum, total: len, steps };
  }

  const OUTLINE = buildOutline(2000);

  function sampleAt(s) {
    const { pts, cum, steps } = OUTLINE;
    let lo = 0, hi = steps - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (cum[mid] < s) lo = mid + 1; else hi = mid;
    }
    const i = Math.max(1, lo);
    const seg = cum[i] - cum[i-1] || 1e-6;
    const f = (s - cum[i-1]) / seg;
    const x = pts[(i-1)*2] + (pts[i*2] - pts[(i-1)*2]) * f;
    const y = pts[(i-1)*2+1] + (pts[i*2+1] - pts[(i-1)*2+1]) * f;
    let tx = pts[i*2] - pts[(i-1)*2];
    let ty = pts[i*2+1] - pts[(i-1)*2+1];
    const m = Math.hypot(tx, ty) || 1e-6;
    return { x, y, nx: -ty / m, ny: tx / m };
  }

  function gauss() {
    return (Math.random() + Math.random() + Math.random() + Math.random() - 2) / 1.2;
  }

  let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, baseScale = 1;
  let P = null, N = 0;
  let BG_P = null, BG_N = 150; // Фоновые частицы для ощущения глубины
  
  let start = 0, settleAt = 0, raf = 0;
  let uiShown = false;

  // --- Управление (Pan & Zoom) ---
  let panX = 0, panY = 0;
  let zoom = 1;
  let isDragging = false;
  let lastX = 0, lastY = 0;
  
  // Для мобильного зума (два пальца)
  const pointers = new Map();
  let lastPinchDist = 0;

  function particleCount() {
    return 1500; 
  }

  function build() {
    N = particleCount();
    P = {
      sx: new Float32Array(N), sy: new Float32Array(N),
      c1x: new Float32Array(N), c1y: new Float32Array(N),
      tx: new Float32Array(N), ty: new Float32Array(N), tz: new Float32Array(N),
      px: new Float32Array(N), py: new Float32Array(N),
      delay: new Float32Array(N), dur: new Float32Array(N),
      size: new Float32Array(N), alpha: new Float32Array(N),
      tint: new Uint8Array(N),
      ph: new Float32Array(N), fr: new Float32Array(N), amp: new Float32Array(N)
    };

    const band = 3.0; 
    const total = OUTLINE.total;

    for (let i = 0; i < N; i++) {
      const frac = i / N;
      const s = (frac + (Math.random() - 0.5) * (1 / N) * 3) * total;
      const p = sampleAt(Math.max(0, Math.min(total - 1e-4, s)));

      let off = gauss() * band;
      if (Math.random() < 0.10) off += (Math.random() < 0.62 ? 1 : -1) * Math.random() * band * 2.6;
      const jitterT = (Math.random() - 0.5) * 0.55;

      P.tx[i] = p.x + p.nx * off + (-p.ny) * jitterT;
      P.ty[i] = p.y + p.ny * off + (p.nx) * jitterT;
      P.tz[i] = (Math.random() - 0.5) * 3.0; // Небольшая глубина для разнообразия размеров

      const a0 = Math.random() * Math.PI * 2;
      const r0 = Math.pow(Math.random(), 2) * 0.9;
      P.sx[i] = Math.cos(a0) * r0;
      P.sy[i] = Math.sin(a0) * r0;

      const bend = (Math.random() - 0.5) * 0.55;
      const mx = P.tx[i] * 0.46, my = P.ty[i] * 0.46;
      P.c1x[i] = mx * Math.cos(bend) - my * Math.sin(bend);
      P.c1y[i] = mx * Math.sin(bend) + my * Math.cos(bend);

      P.delay[i] = frac * 1.55 + Math.random() * 0.95;
      P.dur[i]   = 1.7 + Math.random() * 1.9;

      const big = Math.random() < 0.05;
      P.size[i]  = big ? 12 + Math.random() * 10 : 6 + Math.pow(Math.random(), 1.5) * 7;
      P.alpha[i] = big ? 0.9 : 0.6 + Math.random() * 0.4;
      P.tint[i]  = pickTint();

      P.ph[i]  = Math.random() * Math.PI * 2;
      P.fr[i]  = 0.5 + Math.random() * 1.5;
      P.amp[i] = 0.35 + Math.random() * 1.5;
      
      P.px[i] = cx;
      P.py[i] = cy;
    }

    let last = 0;
    for (let i = 0; i < N; i++) last = Math.max(last, P.delay[i] + P.dur[i]);
    settleAt = last;

    // Инициализация фоновых частиц (звездная пыль)
    BG_P = [];
    for (let i = 0; i < BG_N; i++) {
      BG_P.push({
        x: (Math.random() - 0.5) * 4000, // Разбрасываем далеко за пределы экрана
        y: (Math.random() - 0.5) * 4000,
        z: Math.random() * 2 + 0.5, // Разная глубина (для параллакса и размера)
        alpha: Math.random() * 0.4 + 0.1,
        size: Math.random() * 3 + 1
      });
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W / 2;
    cy = H / 2; // Центр экрана
    baseScale = Math.min(W / 85, H / 85);
  }

  const easeInOutQuad = t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;

  function draw(now) {
    const time = (now - start) / 1000;
    const done = time > settleAt;

    // Очистка фона
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = `rgb(${BG[0]},${BG[1]},${BG[2]})`;
    ctx.fillRect(0, 0, W, H);

    // 1. Рисуем фон (Звезды) с учетом Pan и Zoom
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < BG_N; i++) {
      const b = BG_P[i];
      // Параллакс: фон движется медленнее, чем сердце
      const px = cx + panX * 0.3 + b.x * zoom * 0.5;
      const py = cy + panY * 0.3 + b.y * zoom * 0.5;
      
      // Ограничиваем отрисовку, чтобы не рисовать за экраном
      if (px < -50 || px > W + 50 || py < -50 || py > H + 50) continue;

      const sz = b.size * zoom * b.z;
      ctx.globalAlpha = b.alpha * Math.min(1, zoom); // Затухают при сильном отдалении
      ctx.fillStyle = "#ffe9f3";
      ctx.beginPath();
      ctx.arc(px, py, sz, 0, Math.PI * 2);
      ctx.fill();
    }

    // 2. Рисуем сердце
    const sc = baseScale * zoom;

    for (let i = 0; i < N; i++) {
      let u = (time - P.delay[i]) / P.dur[i];
      if (u <= 0) continue;
      
      let a = P.alpha[i], sz = P.size[i];
      let bx, by, bz;
      
      if (u >= 1) {
        bx = P.tx[i]; by = P.ty[i];
        bz = P.tz[i];
        
        const w = Math.sin(time * P.fr[i] + P.ph[i]);
        const w2 = Math.cos(time * P.fr[i] * 0.66 + P.ph[i]);
        bx += (w * P.amp[i]) * 1.6;
        by += (w2 * P.amp[i]) * 1.6;
        a *= 0.80 + 0.20 * (0.5 + 0.5 * w);
      } else {
        const e = easeInOutQuad(u);
        const inv = 1 - e;
        bx = inv*inv*P.sx[i] + 2*inv*e*P.c1x[i] + e*e*P.tx[i];
        by = inv*inv*P.sy[i] + 2*inv*e*P.c1y[i] + e*e*P.ty[i];
        bz = e * P.tz[i]; 
        a *= Math.min(1, u * 4);
        sz *= 0.72 + 0.28 * e;
      }

      // Добавляем Pan (смещение) и Zoom
      const targetPx = cx + panX + bx * sc;
      const targetPy = cy + panY + by * sc;

      // Эффект "жидкости" (Lerp) — частицы догоняют форму
      if (u < 1) {
        P.px[i] = targetPx;
        P.py[i] = targetPy;
      } else {
        P.px[i] += (targetPx - P.px[i]) * 0.15;
        P.py[i] += (targetPy - P.py[i]) * 0.15;
      }

      const finalSz = sz * zoom;
      const half = finalSz * 0.5;
      
      ctx.globalAlpha = a;
      ctx.drawImage(sprites[P.tint[i]], P.px[i] - half, P.py[i] - half, finalSz, finalSz);
    }

    ctx.globalAlpha = 1;

    if (!uiShown && time > settleAt * 0.62) {
      uiShown = true;
      controls.classList.add("show");
      mark.classList.add("show");
    }

    raf = requestAnimationFrame(draw);
  }

  function run() {
    cancelAnimationFrame(raf);
    controls.classList.remove("show");
    mark.classList.remove("show");
    uiShown = false;
    panX = 0; panY = 0; zoom = 1;
    resize();
    build();
    start = performance.now();
    raf = requestAnimationFrame(draw);
  }

  // --- Обработка событий мыши и касаний ---

  canvas.addEventListener("pointerdown", e => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    
    if (pointers.size === 1) {
      isDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
    }
  });

  window.addEventListener("pointermove", e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    // 1. Логика перетаскивания (один палец или мышь)
    if (pointers.size === 1 && isDragging) {
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      panX += dx;
      panY += dy;
      lastX = e.clientX;
      lastY = e.clientY;
    }
    
    // 2. Логика зума (два пальца)
    if (pointers.size === 2) {
      const pArray = Array.from(pointers.values());
      const dist = Math.hypot(pArray[0].x - pArray[1].x, pArray[0].y - pArray[1].y);
      
      if (lastPinchDist > 0) {
        const factor = dist / lastPinchDist;
        zoom *= factor;
        zoom = Math.max(0.1, Math.min(10.0, zoom)); // Ограничитель зума
      }
      lastPinchDist = dist;
    }
  });

  window.addEventListener("pointerup", e => {
    pointers.delete(e.pointerId);
    if (pointers.size === 0) isDragging = false;
    if (pointers.size < 2) lastPinchDist = 0;
  });

  window.addEventListener("pointercancel", e => {
    pointers.delete(e.pointerId);
    if (pointers.size === 0) isDragging = false;
    if (pointers.size < 2) lastPinchDist = 0;
  });

  // Зум колесиком мыши
  window.addEventListener("wheel", e => {
    // Предотвращаем скролл страницы
    e.preventDefault(); 
    
    // Плавный зум
    const zoomFactor = Math.exp(-e.deltaY * 0.002);
    zoom *= zoomFactor;
    zoom = Math.max(0.1, Math.min(10.0, zoom)); // Ограничитель зума
  }, { passive: false });

  let rt = 0;
  window.addEventListener("resize", () => {
    clearTimeout(rt);
    rt = setTimeout(run, 200);
  });

  replayEl.addEventListener("click", run);

  run();
})();
</script>
</body>
</html>
